<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서소영 / Head turn studio</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"><meta name="description" content="서소영 모션 포트레이트. 3D 두상과 안구 구면, 파츠와 고개 회전을 확인하는 인터랙티브 뷰어.">

<body>
<header><div><span class="eyebrow">PAS / MOTION STUDY</span><h1>서소영 <span>고개 회전</span></h1></div><span class="badge">3D 구면 리그</span><output id="status" role="status">불러오는 중</output></header>
<main>
<aside class="panel tree-panel"><div class="panel-head"><h2>구조</h2><span id="counts" class="meta"></span></div><input id="search" type="search" placeholder="파츠 검색" aria-label="파츠와 디포머 검색"><div class="tabs" role="tablist" aria-label="구조 종류"><button role="tab" aria-selected="true" id="part-tab">파츠</button><button role="tab" aria-selected="false" id="deformer-tab">디포머</button></div><div id="tree" class="tree" role="tabpanel"></div></aside>
<section class="center" aria-label="고개 회전 작업 화면"><div class="panel controls"><div id="presets" class="toolbar"></div><div class="toolbar"><button id="auto" aria-pressed="false">자동 모션 재생</button><button id="track" aria-pressed="false">마우스 시선 추적</button><button id="wire" aria-pressed="false">와이어프레임</button><button id="grid" aria-pressed="false">디포머 격자</button><button id="masks" aria-pressed="false">클리핑 마스크</button></div><div class="toolbar"><button id="sweater" aria-pressed="true">스웨터 정장</button><button id="shirt" aria-pressed="false">반팔 셔츠</button><button id="bangs" aria-pressed="false">앞머리 숨김</button><button id="compare" aria-pressed="false">복원 후 (SAM3+Inpaint)</button></div></div>
<div id="viewport" class="viewport"><div class="view-title"><span id="pose-label">정면 0°</span><span id="version-label">AFTER</span></div><canvas id="stage" aria-label="서소영 2.5D 모델"></canvas><canvas id="overlay" aria-hidden="true"></canvas><div class="view-footer"><span id="selected-label">얼굴 피부</span><span id="angles">X 0° / Y 0° / Z 0°</span></div></div>
<div class="panel toolbar modebar" aria-label="선택 파츠 보기"><button data-mode="all" aria-pressed="true">전체 조립</button><button data-mode="dim" aria-pressed="false">선택 강조</button><button data-mode="solo" aria-pressed="false">단독 보기</button></div></section>
<aside class="panel inspector"><div class="panel-head"><h2>파라미터</h2><button id="reset">초기화</button></div><div class="parameter-scroll"><details id="correction-panel" open><summary>회전 보정 수치</summary><div class="correction-presets"><button id="correction-pure" aria-pressed="false">순수 3D 구 (보정 0%)</button><button id="correction-recommended" aria-pressed="true">Live2D 보정 기본값 (권장)</button></div><div id="corrections" class="params"></div></details><details><summary>모션 파라미터</summary><div id="params" class="params"></div></details></div><div class="tabs" role="tablist" aria-label="검사 종류"><button id="compare-tab" role="tab" aria-selected="true">파츠 복원 비교</button><button id="atlas-tab" role="tab" aria-selected="false">UV 아틀라스</button></div><div id="comparison" role="tabpanel"><h3 id="inspect-label">얼굴 피부</h3><div class="crop-pair"><button class="image-button" id="before-crop"><canvas width="220" height="220"></canvas><span>복원 전</span></button><button class="image-button" id="after-crop"><canvas width="220" height="220"></canvas><span>복원 후</span></button></div><div class="toolbar sheets"><button data-sheet="before_after_parts_comparison.png">전체 비교 시트 ↗</button><button data-sheet="sam3_masks_grid.png">SAM 3 마스크 ↗</button></div></div><div id="atlas-panel" hidden role="tabpanel"><div class="panel-head"><h3>2048 × 2048</h3><button id="atlas-zoom">확대 ↗</button></div><canvas id="atlas" width="640" height="640" aria-label="파츠를 선택할 UV 아틀라스" tabindex="0"></canvas></div></aside>
</main>
<dialog id="lightbox"><div class="dialog-head"><h2 id="lightbox-title"></h2><button id="close-modal" aria-label="확대 이미지 닫기">닫기</button></div><div class="lightbox-scroll"><img id="lightbox-image" alt=""></div></dialog>
<script type="module" src="./app.mjs"></script></body></html>
