<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>서소영 · 고개 회전</title>
  <meta name="description" content="서소영 얼굴의 방향별 모양과 눈 움직임을 확인하는 인터랙티브 화면.">
  <meta name="theme-color" content="#0b0f17">
  <meta property="og:site_name" content="Seosoyoung Motion Portrait">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="서소영 · 고개 회전">
  <meta property="og:description" content="1단계: 맨 얼굴. 머리카락은 다음 단계">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-ui">
    <div>
      <span class="eyebrow">PAS / MOTION STUDY</span>
      <h1>서소영 <span>고개 회전</span></h1>
    </div>
    <p class="stage-note">1단계: 맨 얼굴. 머리카락은 다음 단계</p>
    <output id="status" role="status" aria-live="polite">화면 준비 중</output>
  </header>
  <main class="app-ui">
    <aside class="panel tree-panel" aria-label="표시 요소">
      <div class="panel-head"><h2>표시 요소</h2></div>
      <div id="parts-tree" class="tree"></div>
    </aside>
    <section class="center" aria-label="고개 회전 화면">
      <div class="panel controls">
        <div class="toolbar">
          <button id="auto" type="button" aria-pressed="false">자동 모션</button>
          <button id="track" type="button" aria-pressed="false">마우스 추적</button>
        </div>
      </div>
      <div class="viewport" id="viewport">
        <div id="loading" class="loading" role="status"><span class="loading-mark"></span><span>화면을 준비하고 있습니다</span></div>
        <canvas id="stage" aria-label="서소영 방향별 얼굴 화면" hidden></canvas>
        <div class="view-title"><span id="pose-label">정면</span></div>
      </div>
    </section>
    <aside class="panel inspector" aria-labelledby="control-title">
      <div class="panel-head"><h2 id="control-title">움직임</h2><button id="reset" type="button">초기화</button></div>
      <div id="params" class="parameter-scroll"></div>
    </aside>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
